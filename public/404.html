<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>404 - 页面走丢了 | PC on iPhone</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* 💡 直接在这里写样式，不依赖外部 CSS 文件 */
      :root {
        --page: #ffffff;
        --ink: #14161d;
        --ink-soft: rgba(20, 22, 29, 0.66);
        --hairline: rgba(20, 30, 60, 0.12);
        --tint: #2f6ae0;
        --tint-2: #7a3ff2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #000000;
          --ink: #f5f6fa;
          --ink-soft: rgba(245, 246, 250, 0.68);
          --hairline: rgba(255, 255, 255, 0.14);
          --tint: #4c8dff;
          --tint-2: #9a6bff;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--page);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .box {
        text-align: center;
        background: rgba(255, 255, 255, 0.75);
        padding: 40px 20px;
        border-radius: 34px;
        box-shadow: 0 20px 40px -15px rgba(30, 45, 90, 0.15), inset 0 0 0 1px var(--hairline);
        max-width: 500px;
        width: 100%;
      }
      @media (prefers-color-scheme: dark) {
        .box { background: rgba(30, 32, 38, 0.75); }
      }
      .code {
        font-size: 6rem;
        font-weight: 800;
        line-height: 1;
        margin: 0 0 20px 0;
        background: linear-gradient(135deg, var(--tint), var(--tint-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 { font-size: 1.5rem; margin-bottom: 12px; }
      p { color: var(--ink-soft); margin-bottom: 30px; font-size: 0.95rem; }
      .btn {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 999px;
        background: linear-gradient(180deg, #2f7dff, #1450e0);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        box-shadow: 0 12px 30px -12px rgba(20, 80, 224, 0.6);
        transition: transform 0.18s ease;
      }
      .btn:hover { transform: translateY(-2px); }
    </style>
  </head>
  <body>
    <div class="box">
      <h1 class="code">404</h1>
      <h1>页面走丢了</h1>
      <p>非常抱歉，您访问的页面可能已被移除、重命名，或者暂时不可用。</p>
      
      <!-- 返回首页的链接，使用相对路径 -->
      <a class="btn" href="https://maihaobo.github.io/PC-on-iPhone-Website/index.html">返回首页</a>
    </div>
  </body>
</html>
