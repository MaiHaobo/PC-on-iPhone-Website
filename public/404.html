      :root {
        --page: #ffffff;
        --ink: #14161d;
        --ink-soft: rgba(20, 22, 29, 0.66);
        --ink-faint: rgba(20, 22, 29, 0.42);
        --tint: #2f6ae0;
        --tint-2: #7a3ff2;
        --lift: rgba(20, 30, 60, 0.05);

        --hairline: rgba(20, 30, 60, 0.12);

          --ink: #f5f6fa;
          --ink-soft: rgba(245, 246, 250, 0.68);
          --ink-faint: rgba(245, 246, 250, 0.42);
          --tint: #4c8dff;
          --tint-2: #9a6bff;
          --lift: rgba(255, 255, 255, 0.09);
          --lift-strong: rgba(255, 255, 255, 0.15);
          --hairline: rgba(255, 255, 255, 0.14);
          --menu-bg: rgba(16, 17, 22, 0.97);
          color-scheme: dark;
        }
        body::before { opacity: 0.5; }
      }

      *, *::before, *::after { box-sizing: border-box; }

      html { -webkit-text-size-adjust: 100%; overflow-x: clip; }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;

        color: var(--ink);

      }

      /* 与站点其它页面同款底色光晕（毛玻璃要有东西可模糊） */
      body::before {

        z-index: -1;
        pointer-events: none;
        background:

          radial-gradient(32vmax 26vmax at 86% 10%, rgba(154, 107, 255, 0.12), transparent 64%),

      a { color: inherit; text-decoration: none; }

      /* ---------------- 导航（与站点其它页面一致） ---------------- */
      .site-nav-wrap {

        top: calc(14px + env(safe-area-inset-top));

        right: 0;

        padding-inline: var(--gutter);
        pointer-events: none;

      .site-nav-wrap .site-nav { pointer-events: auto; }

      .site-nav {

          inset 0 1px 0 rgba(255, 255, 255, 0.95),
          inset 0 0 0 1px var(--hairline);
      }

      @media (prefers-color-scheme: dark) {

          background: rgba(26, 28, 34, 0.66);
          box-shadow:

      .brand {

        align-items: center;
        gap: 10px;
        font-weight: 640;
        letter-spacing: -0.02em;
        font-size: 0.98rem;
        white-space: nowrap;
        margin-right: auto;
      }

      .brand-mark {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        overflow: hidden;
        flex: none;
      }

      .brand-mark img { width: 100%; height: 100%; object-fit: cover; display: block; }

      .nav-links { display: flex; align-items: center; gap: 2px; }

      .nav-links a {

        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.9rem;
        color: var(--ink-soft);
        white-space: nowrap;
        transition: background-color 0.18s ease, color 0.18s ease;

      .nav-links a:hover { color: var(--ink); background: var(--lift); }

      .nav-cta {
        padding: 9px 18px;
        border-radius: 999px;
        font-size: 0.9rem;
        font-weight: 600;
        background: #16181f;
        color: #fff;
        white-space: nowrap;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }

      .nav-cta:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 22px -6px rgba(20, 30, 60, 0.35);
      }

      .nav-toggle {
        display: none;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 50%;
        background: var(--lift);
        color: var(--ink);
        cursor: pointer;
        place-items: center;
      }

      @media (max-width: 950px) {
        .nav-toggle { display: grid; }
        .site-nav { position: relative; z-index: 100; }
        .nav-cta { display: none; }

        .nav-links {
          position: absolute;
          top: calc(100% + 10px);
          left: 10px;
          right: 10px;
          flex-direction: column;
          align-items: stretch;
          padding: 10px;
          border-radius: 24px;
          background: var(--menu-bg);
          backdrop-filter: blur(20px) saturate(1.5);
          -webkit-backdrop-filter: blur(20px) saturate(1.5);
          box-shadow: 0 14px 40px rgba(0, 0, 0, 0.12), inset 0 0 0 1px var(--hairline);
          opacity: 0;
          visibility: hidden;
          transform: translateY(-6px);
          transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
          z-index: 101;
        }

        .site-nav[data-open="true"] .nav-links {
          opacity: 1;
          visibility: visible;
          transform: none;
        }

        .nav-links a { padding: 12px 14px; border-radius: 14px; }
      }

      /* ---------------- 主体 ---------------- */
      .error-main {
        flex: 1;
        display: grid;
        place-items: center;
        padding: calc(96px + env(safe-area-inset-top)) var(--gutter) clamp(48px, 8vw, 96px);
      }

      .panel {
        position: relative;
        width: 100%;
        max-width: 560px;
        padding: clamp(32px, 6vw, 52px) clamp(24px, 5vw, 48px);
        border-radius: var(--radius-lg);
        text-align: center;
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        box-shadow:
          0 18px 44px -20px rgba(30, 45, 90, 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 0.95),
          inset 0 0 0 1px var(--hairline);
        animation: rise 0.6s cubic-bezier(0.2, 0.7, 0.3, 1) both;

      @media (prefers-color-scheme: dark) {
        .panel {
          background: rgba(26, 28, 34, 0.66);
          box-shadow:

            inset 0 1px 0 rgba(255, 255, 255, 0.09),
            inset 0 0 0 1px var(--hairline);
        }
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        .panel { animation: none; }

      .eyebrow {

      .btn--primary {

      }

      .btn--ghost {
        background: var(--lift);

        box-shadow: inset 0 0 0 1px var(--hairline);
      }

      .btn:hover { transform: translateY(-2px); }
      .btn--ghost:hover { background: var(--lift-strong); }

      .divider {
        height: 1px;
        margin: clamp(26px, 5vw, 34px) 0 clamp(18px, 4vw, 24px);

      .quick-label {

      .quick {

      .quick a {

      /* ---------------- 页脚（与站点其它页面同款毛玻璃卡片） ---------------- */
      .site-footer {

      .footer-card {

      @media (prefers-color-scheme: dark) {

      .footer-card .brand {

      }

      .footer-legal + .footer-legal { margin-top: 5px; }

    </style>

    <script>
      (function () {
        var nav = document.querySelector(".site-nav");
        var toggle = document.querySelector(".nav-toggle");
        if (nav && toggle) {
          toggle.addEventListener("click", function () {
            var open = nav.dataset.open !== "true";
            nav.dataset.open = String(open);
            toggle.setAttribute("aria-expanded", String(open));
          });
          document.addEventListener("click", function (e) {
            if (!nav.contains(e.target)) {
              nav.dataset.open = "false";
              toggle.setAttribute("aria-expanded", "false");
            }
          });
          document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
              nav.dataset.open = "false";
              toggle.setAttribute("aria-expanded", "false");
            }
          });
        }

        document.querySelectorAll("[data-year]").forEach(function (el) {
          el.textContent = String(new Date().getFullYear());
        });

        // 把访问失败的那个地址显示出来，方便用户核对是不是打错了
        var chip = document.getElementById("path-chip");
        var path = decodeURIComponent(location.pathname).replace("/PC-on-iPhone-Website", "");
        if (chip && path && path !== "/" && path.indexOf("404") === -1) {
          chip.textContent = path + location.search;
          chip.style.display = "block";
        }
      })();
    </script>
