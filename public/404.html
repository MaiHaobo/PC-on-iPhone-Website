      .panel { animation: panel-in 0.4s ease both; }

      @keyframes panel-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: none; }
      }

      /* 入场分级动画：自上而下依次浮现 */
      .panel > * {
        position: relative;
        z-index: 1;
        animation: rise 0.55s cubic-bezier(0.2, 0.7, 0.3, 1) both;
      }

      .panel > *:nth-child(1) { animation-delay: 0.05s; }
      .panel > *:nth-child(2) { animation-delay: 0.15s; }
      .panel > *:nth-child(3) { animation-delay: 0.23s; }
