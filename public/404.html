<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>404 - 页面走丢了 | PC on iPhone</title>
    <link rel="icon" href="/PC-on-iPhone-Website/favicon.svg" type="image/svg+xml" />
    <style>
      /* =========================================
         1. 基础变量
         ========================================= */
      :root {
        --page: #ffffff;
        --ink: #14161d;
        --ink-soft: rgba(20, 22, 29, 0.66);
        --hairline: rgba(20, 30, 60, 0.12);
        --tint: #2f6ae0;
        --tint-2: #7a3ff2;
        --lift: rgba(20, 30, 60, 0.05);
        --lift-strong: rgba(20, 30, 60, 0.09);
        
        /* 💡 核心修复：降低透明度，让毛玻璃效果显现 */
        --menu-bg: rgba(255, 255, 255, 0.85); 
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #000000;
          --ink: #f5f6fa;
          --ink-soft: rgba(245, 246, 250, 0.68);
          --hairline: rgba(255, 255, 255, 0.14);
          --tint: #4c8dff;
          --tint-2: #9a6bff;
          --lift: rgba(255, 255, 255, 0.09);
          --lift-strong: rgba(255, 255, 255, 0.15);
          --menu-bg: rgba(30, 32, 38, 0.85); 
        }
      }

      * { box-sizing: border-box; }
      
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
        background: var(--page);
        color: var(--ink);
        display: flex;
        flex-direction: column;
      }

      a { text-decoration: none; color: inherit; }

      /* =========================================
         2. 导航栏样式 (胶囊高光材质)
         ========================================= */
      .site-nav-wrap {
        position: absolute;
        top: calc(14px + env(safe-area-inset-top)); 
        left: 0;
        right: 0;
        z-index: 50;
        padding-inline: 20px;
        pointer-events: none;
      }

      .site-nav {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px 8px 18px;
        border-radius: 999px; 
        
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(14px) saturate(1.5);
        -webkit-backdrop-filter: blur(14px) saturate(1.5);
        box-shadow:
          0 20px 40px -15px rgba(30, 45, 90, 0.15),
          inset 0 1px 1px rgba(255, 255, 255, 1),
          inset 0 0 0 1px var(--hairline);
          
        pointer-events: auto;
        max-width: 1120px;
        margin: 0 auto;
      }
      
      @media (prefers-color-scheme: dark) {
        .site-nav { 
          background: rgba(30, 32, 38, 0.75);
          box-shadow:
            0 20px 40px -15px rgba(0, 0, 0, 0.6),
            inset 0 1px 1px rgba(255, 255, 255, 0.1),
            inset 0 0 0 1px var(--hairline);
        }
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        font-size: 0.98rem;
        white-space: nowrap;
        margin-right: auto;
      }
      
      .brand-mark {
        width: 26px; height: 26px;
        border-radius: 8px;
        display: grid; place-items: center;
        background: linear-gradient(145deg, var(--tint), var(--tint-2));
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.5);
      }
      .brand-mark svg { width: 15px; height: 15px; }

      .nav-toggle {
        display: none;
        width: 40px; height: 40px;
        border: 0; border-radius: 50%;
        background: var(--lift);
        color: var(--ink);
        cursor: pointer;
        place-items: center;
        transition: background 0.18s;
      }

      /* =========================================
         3. 电脑端导航
         ========================================= */
      .nav-links { display: flex; align-items: center; gap: 2px; }
      .nav-links a {
        display: block;
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 0.9rem;
        color: var(--ink-soft);
        transition: background-color 0.18s ease, color 0.18s ease;
      }
      .nav-links a:hover { color: var(--ink); background: var(--lift); }

      .nav-cta {
        padding: 9px 18px;
        border-radius: 999px;
        font-size: 0.9rem;
        font-weight: 600;
        background: #16181f;
        color: #fff;
        white-space: nowrap;
      }

      /* =========================================
         4. 手机端菜单 (完美对齐首页)
         ========================================= */
      @media (max-width: 780px) {
        .nav-toggle { display: grid; }
        .site-nav { position: relative; overflow: visible !important; }
        .nav-cta { display: none; }
        
        .nav-links {
          position: absolute;
          top: calc(100% + 10px);
          left: 10px; 
          right: 10px;
          flex-direction: column;
          align-items: stretch;
          padding: 10px;
          gap: 2px; /* 💡 恢复菜单项间距 */
          border-radius: 24px;
          
          background: var(--menu-bg);
          backdrop-filter: blur(20px) saturate(1.5);
          -webkit-backdrop-filter: blur(20px) saturate(1.5);
          
          /* 💡 阴影降低到0.12，与首页完全一致 */
          box-shadow: 0 14px 40px rgba(0, 0, 0, 0.12), inset 0 0 0 1px var(--hairline); 
          opacity: 0; 
          visibility: hidden;
          transform: translateY(-6px);
          transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
          z-index: 100;
        }

        .site-nav[data-open="true"] .nav-links {
          opacity: 1; 
          visibility: visible; 
          transform: none;
        }

        .nav-links a { 
          padding: 12px 14px; 
          border-radius: 14px;
          line-height: normal; /* 💡 防止文字间距被拉大 */
        }
      }

      /* =========================================
         5. 404 卡片居中布局
         ========================================= */
      .error-wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(100px + env(safe-area-inset-top)) 20px 40px; 
      }

      .box {
        text-align: center;
        background: rgba(255, 255, 255, 0.75);
        padding: 50px 30px;
        border-radius: 34px;
        box-shadow: 0 20px 40px -15px rgba(30, 45, 90, 0.15), inset 0 0 0 1px var(--hairline);
        max-width: 500px;
        width: 100%;
      }
      
      @media (prefers-color-scheme: dark) {
        .box { background: rgba(30, 32, 38, 0.75); }
      }

      .code {
        font-size: 6rem;
        font-weight: 800;
        line-height: 1;
        margin: 0 0 20px 0;
        background: linear-gradient(135deg, var(--tint), var(--tint-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .box h1 { font-size: 1.5rem; margin: 0 0 12px 0; }
      .box p { color: var(--ink-soft); margin-bottom: 30px; font-size: 0.95rem; }
      
      .btn {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 999px;
        background: linear-gradient(180deg, #2f7dff, #1450e0);
        color: #fff;
        font-weight: 600;
        font-size: 0.95rem;
        box-shadow: 0 12px 30px -12px rgba(20, 80, 224, 0.6);
        transition: transform 0.18s ease;
      }
      .btn:hover { transform: translateY(-2px); }
    </style>
  </head>
  <body>
    
    <header class="site-nav-wrap">
      <nav class="site-nav" aria-label="主导航">
        <a class="brand" href="/PC-on-iPhone-Website/index.html">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="6" y="2.5" width="12" height="19" rx="3" />
              <path d="M10 5h4" />
            </svg>
          </span>
          PC on iPhone
        </a>

        <button class="nav-toggle" type="button" aria-expanded="false" aria-label="切换菜单">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>

        <div class="nav-links">
          <a href="/PC-on-iPhone-Website/index.html">首页</a>
          <a href="/PC-on-iPhone-Website/features.html">功能</a>
          <a href="/PC-on-iPhone-Website/faq.html">常见问题</a>
          <a href="/PC-on-iPhone-Website/about.html">关于</a>
        </div>

        <a class="nav-cta" href="/PC-on-iPhone-Website/index.html#get-started">开始使用</a>
      </nav>
    </header>

    <main class="error-wrapper">
      <div class="box">
        <h1 class="code">404</h1>
        <h1>页面走丢了</h1>
        <p>非常抱歉，您访问的页面可能已被移除、重命名，或者暂时不可用。</p>
        
        <a class="btn" href="/PC-on-iPhone-Website/index.html">返回首页</a>
      </div>
    </main>

    <script>
      const nav = document.querySelector(".site-nav");
      const toggle = document.querySelector(".nav-toggle");
      if (nav && toggle) {
        toggle.addEventListener("click", () => {
          const isOpen = nav.dataset.open === "true";
          nav.dataset.open = String(!isOpen);
          toggle.setAttribute("aria-expanded", String(!isOpen));
        });
      }
    </script>
  </body>
</html>
