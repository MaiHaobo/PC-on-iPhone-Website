<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <!-- 背景的深蓝渐变 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4b8df8" />
      <stop offset="100%" stop-color="#0a1aac" />
    </linearGradient>
    
    <!-- 线框的微弱发光/渐变质感的滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. 大圆角矩形蓝色底板 -->
  <rect width="100" height="100" rx="24" fill="url(#bgGradient)" />

  <!-- 2. 第一层外框 -->
  <rect x="16" y="16" width="68" height="68" rx="18" fill="none" stroke="#ffffff" stroke-width="4.5" opacity="0.9" filter="url(#glow)" />

  <!-- 3. 第二层中框 -->
  <rect x="28" y="28" width="44" height="44" rx="12" fill="none" stroke="#ffffff" stroke-width="4.5" opacity="0.9" filter="url(#glow)" />

  <!-- 4. 第三层内框 -->
  <rect x="40" y="40" width="20" height="20" rx="6" fill="none" stroke="#ffffff" stroke-width="4.5" opacity="0.9" filter="url(#glow)" />

  <!-- 5. 最中心的实心圆点 -->
  <circle cx="50" cy="50" r="4" fill="#ffffff" filter="url(#glow)" />
</svg>